html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam MP4 Recorder</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 600px; background: #222; border-radius: 8px; }
        .controls { margin-top: 15px; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Webcam MP4 Recorder</h2>
    
    <!-- Live Preview -->
    <video id="preview" autoplay muted playsinline></video>
    
    <div class="controls">
        <button id="startBtn">Start Recording</button>
        <button id="stopBtn" disabled>Stop & Save</button>
    </div>

    <script>
        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        let stream;
        let mediaRecorder;
        let recordedChunks = [];

        // 1. Request Webcam and Audio Access
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                });
                preview.srcObject = stream;
            } catch (err) {
                console.error("Error accessing webcam:", err);
                alert("Could not access webcam. Please grant permissions.");
            }
        }

        // 2. Start Recording Logic
        startBtn.addEventListener('click', async () => {
            if (!stream) await initCamera();
            if (!stream) return;

            recordedChunks = [];
            
            // Determine best supported format (MP4 vs WebM fallback)
            let options = { mimeType: 'video/mp4;codecs=h244' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm;codecs=vp9' };
            }

            mediaRecorder = new MediaRecorder(stream, options);
            
            // Push data chunks as they become available
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            // Trigger download automatically when recording stops
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: options.mimeType });
                const url = URL.createObjectURL(blob);
                
                // Create a temporary link to download the file
                const a = document.createElement('a');
                a.href = url;
                // Match the extension to the container used
                a.download = options.mimeType.includes('mp4') ? 'webcam-video.mp4' : 'webcam-video.webm';
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        // 3. Stop Recording Logic
        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            
            // Stop camera tracks to turn off the physical webcam light
            stream.getTracks().forEach(track => track.stop());
            stream = null;
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        // Initialize camera preview on load
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
